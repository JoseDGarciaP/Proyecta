# Base de datos local para desarrollo. En producción se usa Supabase (también PostgreSQL + pgvector).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: proyecta
      POSTGRES_PASSWORD: proyecta
      POSTGRES_DB: proyecta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
